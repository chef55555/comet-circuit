name: Deploy Comet Circuit to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build static site
        run: npm run build
      - name: Normalize project-site asset paths
        run: |
          test -f dist/client/index.html
          grep -Fq '/comet-circuit/_next/' dist/client/index.html
          test -d dist/client/comet-circuit/_next
          test ! -e dist/client/_next
          mv dist/client/comet-circuit/_next dist/client/_next
          rmdir dist/client/comet-circuit
          test -d dist/client/_next
          test ! -e dist/client/comet-circuit
      - name: Disable Jekyll processing
        run: touch dist/client/.nojekyll
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist/client
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
